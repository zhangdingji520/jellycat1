<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🐰 Jellycat 小窝 · 智能寻宝</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #f9f5f0 0%, #fff4e8 100%); font-family: system-ui; padding: 2rem 1rem; min-height: 100vh; }
        .card { max-width: 1200px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: #fce7d7; padding: 2rem; text-align: center; border-bottom: 2px solid #ffd6b5; }
        .header h1 { font-size: 2rem; color: #6b3e1c; }
        .content { padding: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { font-weight: 600; color: #5a3e2b; display: block; margin-bottom: 0.5rem; }
        input, select { width: 100%; padding: 0.85rem 1rem; border-radius: 1.5rem; border: 1px solid #ffe1c4; background: #fffef9; }
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.75rem 1rem;
            background: #fffaf5;
            padding: 1rem 1.2rem;
            border-radius: 1.5rem;
            border: 1px solid #ffe7d4;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-weight: normal;
            cursor: pointer;
            background: #ffffff;
            padding: 0.3rem 0.5rem;
            border-radius: 2rem;
            transition: all 0.2s;
            margin: 0;
            font-size: 0.9rem;
            color: #6b4c34;
            border: 1px solid #ffdeca;
            white-space: normal;
            word-break: keep-all;
            text-align: center;
            min-width: 0;
            flex: 1;
        }
        .checkbox-group label:hover { background: #ffefe3; border-color: #f7b787; }
        .checkbox-group input { width: auto; margin: 0; accent-color: #e9a26c; flex-shrink: 0; }
        .button-group { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .btn {
            background: #e9a26c;
            color: white;
            border: none;
            padding: 0.9rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            line-height: 1;
        }
        .btn:hover { background: #dc8b4f; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .btn:disabled { background: #d9c2ae; cursor: not-allowed; transform: none; }
        .stats { display: flex; flex-wrap: wrap; gap: 1rem; margin: 2rem 0 1.5rem; }
        .stat-item { background: #fef5ea; border-radius: 2rem; padding: 0.6rem 1.2rem; text-align: center; flex: 1; min-width: 90px; border: 1px solid #ffeedd; }
        .stat-number { font-size: 1.6rem; font-weight: bold; color: #7b5a3e; }
        .url-list { background: #fffcf8; border-radius: 1.5rem; border: 1px solid #ffe8da; max-height: 400px; overflow-y: auto; padding: 0.5rem; }
        .url-item { padding: 0.7rem 1rem; border-bottom: 1px solid #ffedd9; word-break: break-all; display: flex; align-items: baseline; gap: 0.5rem; }
        .url-item .index { font-weight: bold; color: #e9a26c; min-width: 2rem; }
        .url-item a { color: #b2722e; text-decoration: none; word-break: break-all; }
        .log-area { margin-top: 1.5rem; background: #fffaf5; border-radius: 1.5rem; border: 1px solid #ffe8da; padding: 1rem; }
        .log-content { background: #fef7f0; border-radius: 1rem; padding: 0.75rem; max-height: 200px; overflow-y: auto; font-size: 0.8rem; font-family: monospace; }
        .log-line { border-bottom: 1px solid #ffedd9; padding: 0.2rem 0; white-space: pre-wrap; }
        .error-message { background: #ffe8e6; color: #bc5a3c; border-radius: 1.5rem; padding: 0.75rem; margin: 1rem 0; text-align: center; }
        .footer { text-align: center; font-size: 0.7rem; color: #cbab8b; border-top: 1px solid #ffedd9; padding: 1.5rem; background: #fffbf7; }
        .title-row { display: flex; align-items: center; justify-content: space-between; margin: 1rem 0 0.5rem; }
        .save-btn { background: #a0c4a8; color: #2c5e2e; border: none; padding: 0.4rem 1rem; border-radius: 2rem; font-size: 0.8rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 0.3rem; }
        .save-btn:hover { background: #8bb891; }
        .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        @media (max-width: 700px) { .checkbox-group { grid-template-columns: repeat(3,1fr); } }
        @media (max-width: 480px) { .checkbox-group { grid-template-columns: repeat(2,1fr); } }
        .subnote { font-size: 0.7rem; color: #b7916e; margin-top: 0.4rem; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h1>🐣 Jellycat 小窝 · 智能寻宝</h1>
        <p>搜索绝版系列，全球独立站库存检测，自动剔除美元站 🍃</p>
    </div>
    <div class="content">
        <div class="form-group">
            <label>🔑 Serper API 密钥</label>
            <input type="password" id="apiKey" placeholder="例如: 17e141da4fb66b674c2a5b046afb598834bf28f2" value="">
            <div class="subnote">👉 免费申请 <a href="https://serper.dev" target="_blank">serper.dev</a>，每月 2500 次搜索</div>
        </div>

        <div class="form-group">
            <label>🌍 选择国家（可多选）</label>
            <div class="checkbox-group" id="countryCheckboxes">
                <label><input type="checkbox" value="DE" checked> 🇩🇪 德国</label>
                <label><input type="checkbox" value="ES" checked> 🇪🇸 西班牙</label>
                <label><input type="checkbox" value="FR" checked> 🇫🇷 法国</label>
                <label><input type="checkbox" value="IT" checked> 🇮🇹 意大利</label>
                <label><input type="checkbox" value="NL" checked> 🇳🇱 荷兰</label>
                <label><input type="checkbox" value="BE" checked> 🇧🇪 比利时</label>
                <label><input type="checkbox" value="PL" checked> 🇵🇱 波兰</label>
                <label><input type="checkbox" value="PT" checked> 🇵🇹 葡萄牙</label>
                <label><input type="checkbox" value="GB"> 🇬🇧 英国</label>
                <label><input type="checkbox" value="AT"> 🇦🇹 奥地利</label>
                <label><input type="checkbox" value="CH"> 🇨🇭 瑞士</label>
                <label><input type="checkbox" value="LU"> 🇱🇺 卢森堡</label>
            </div>
        </div>

        <div class="form-group">
            <label>🔍 搜索关键词（英文逗号分隔）</label>
            <input type="text" id="keywords" value="jellycat nesting bunnies,jellycat stacking bunnies">
        </div>

        <div class="form-group">
            <label>🏷️ SKU 码（可选，多个用逗号分隔）</label>
            <input type="text" id="skuInput" placeholder="例如: BOD3BT, WEE6PN">
        </div>

        <div class="form-group">
            <label>📦 UPC 码（可选，多个用逗号分隔）</label>
            <input type="text" id="upcInput" placeholder="例如: 0670983142662, 670983148565">
        </div>

        <div class="form-group">
            <label>🎯 目标独立站数量</label>
            <input type="number" id="target" value="100" min="10" max="500" step="10">
        </div>

        <div class="form-group">
            <label>🖥️ 后端代理地址</label>
            <input type="text" id="proxyUrl" placeholder="https://your-app.vercel.app/api/search" value="https://jellycat1-ylhr.vercel.app/api/search">
            <div class="subnote">📡 请使用你自己的后端地址</div>
        </div>

        <div class="button-group">
            <button id="startBtn" class="btn">🚀 开始寻宝</button>
            <button id="pauseBtn" class="btn" disabled>⏸️ 暂停</button>
            <button id="resumeBtn" class="btn" disabled>▶️ 继续</button>
            <button id="detectBtn" class="btn" disabled>🔍 检测库存</button>
        </div>
        <div id="errorMsg" class="error-message" style="display:none;"></div>

        <div id="logArea" class="log-area" style="display:none;">
            <div class="log-title">📋 寻宝日志</div>
            <div id="logContent" class="log-content"></div>
        </div>

        <div id="resultArea" style="display:none;">
            <div class="stats">
                <div class="stat-item"><div class="stat-number" id="totalCount">0</div><div class="stat-label">独立站总数</div></div>
                <div class="stat-item"><div class="stat-number" id="buyableCount">0</div><div class="stat-label">✅ 可购买</div></div>
                <div class="stat-item"><div class="stat-number" id="soldOutCount">0</div><div class="stat-label">🚫 售罄/缺货</div></div>
                <div class="stat-item"><div class="stat-number" id="unknownCount">0</div><div class="stat-label">❓ 无法判断</div></div>
                <div class="stat-item"><div class="stat-number" id="usdCount">0</div><div class="stat-label">💵 已排除美元站</div></div>
            </div>
            <div class="title-row">
                <h3 style="margin:0;">✨ 可购买宝贝（点开即达）</h3>
                <button id="saveUrlsBtn" class="save-btn" disabled>💾 保存链接 (.txt)</button>
            </div>
            <div id="buyableList" class="url-list"><div style="text-align:center; color:#bda48a; padding:2rem;">✨ 点击搜索后，这里会出现可购买链接 ✨</div></div>
        </div>
    </div>
    <div class="footer">🐇 数据来源 Serper.dev | 独立站库存实时检测 | 自动过滤美元标价站点</div>
</div>

<script>
    // 黑名单（与后端保持一致）
    const EXCLUDE_DOMAINS = [
        "jellycat.com", "eu.jellycat.com", "de.jellycat.com", "fr.jellycat.com",
        "amazon", "ebay", "walmart", "target", "toysrus", "wish", "etsy", "zalando",
        "bol.com", "aliexpress", "cdiscount", "fnac", "darty", "otto",
        "vinted", "depop", "allegro", "marktplaats", "olx", "wallapop", "leboncoin",
        "hood.de", "kleinanzeigen",
        "facebook", "instagram", "tiktok", "twitter", "pinterest", "youtube",
        "jellyjournal.com", "lilietmilou.com", "ubuy", "lodenfrey.com"
    ];
    function isExcludedUrl(url) { return EXCLUDE_DOMAINS.some(domain => url.toLowerCase().includes(domain)); }

    // DOM 元素
    const apiKeyInput = document.getElementById('apiKey');
    const proxyUrlInput = document.getElementById('proxyUrl');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const detectBtn = document.getElementById('detectBtn');
    const errorDiv = document.getElementById('errorMsg');
    const resultArea = document.getElementById('resultArea');
    const logArea = document.getElementById('logArea');
    const logContent = document.getElementById('logContent');
    const totalSpan = document.getElementById('totalCount');
    const buyableSpan = document.getElementById('buyableCount');
    const soldOutSpan = document.getElementById('soldOutCount');
    const unknownSpan = document.getElementById('unknownCount');
    const usdSpan = document.getElementById('usdCount');
    const buyableListDiv = document.getElementById('buyableList');
    const saveUrlsBtn = document.getElementById('saveUrlsBtn');

    const skuInput = document.getElementById('skuInput');
    const upcInput = document.getElementById('upcInput');

    let currentTask = null;
    let shouldStop = false;
    let isPaused = false;
    let resumeResolver = null;

    // 存储已收集的结果（用于检测按钮）
    let collectedResults = [];      // 存储 { url, status } 对象（初始 status 可能为空，检测后更新）
    let collectedDomainUrls = [];   // 存储 URL 字符串（用于检测）

    function addLog(msg, isError = false) {
        const line = document.createElement('div');
        line.className = 'log-line';
        line.style.color = isError ? '#bc5a3c' : '#5a3e2b';
        line.textContent = `🕒 ${new Date().toLocaleTimeString()}  ${msg}`;
        logContent.appendChild(line);
        line.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function clearLog() { logContent.innerHTML = ''; }

    function getSelectedCountries() {
        return Array.from(document.querySelectorAll('#countryCheckboxes input:checked')).map(cb => cb.value);
    }

    function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        setTimeout(() => errorDiv.style.display = 'none', 5000);
    }

    async function waitIfPaused() {
        while (isPaused && !shouldStop) {
            await new Promise(resolve => { resumeResolver = resolve; });
        }
    }

    function saveUrlsToFile() {
        if (currentBuyableUrls.length === 0) {
            alert('没有可购买的链接，请先搜索。');
            return;
        }
        const content = currentBuyableUrls.join('\n');
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'jellycat_buyable_links.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function buildKeywords() {
        let kwList = [];
        const mainKw = document.getElementById('keywords').value;
        if (mainKw.trim()) kwList.push(...mainKw.split(',').map(k => k.trim()).filter(k => k));
        const sku = skuInput.value.trim();
        if (sku) kwList.push(...sku.split(',').map(k => k.trim()).filter(k => k));
        const upc = upcInput.value.trim();
        if (upc) kwList.push(...upc.split(',').map(k => k.trim()).filter(k => k));
        return [...new Map(kwList.map(k => [k, k])).values()];
    }

    let currentBuyableUrls = [];

    // 库存检测函数（独立于搜索）
    async function performDetection(urls) {
        addLog(`🔍 开始检测库存（共 ${urls.length} 个网址）...`);
        const results = [];
        for (let i = 0; i < urls.length; i++) {
            const url = urls[i];
            addLog(`  检测 ${i+1}/${urls.length}: ${url}`);
            const status = await checkPage(url);
            results.push({ url, status });
        }
        return results;
    }

    // 单个页面检测（调用后端或直接请求？为了统一，这里调用后端？但后端已提供检测，我们可以直接使用已有的 verify 逻辑？不，为了复用，我们直接调用后端？但后端接口是搜索+检测一体的，不适合单独检测。
    // 更好的方法：前端直接请求页面并检测（跨域问题）。实际上我们的后端已经具备检测能力，但是需要重新构造请求。为了简化，我们可以在前端调用相同的后端，但需要传递一个特殊标记？
    // 更简单：直接在前端用 fetch 请求页面内容，并检测缺货关键词（前端跨域问题无法解决）。所以必须通过后端。
    // 解决方案：在后端增加一个专门用于检测库存的接口（例如 /api/check），或者复用 /api/search 但传入 query 为空？不可行。
    // 既然前端已经收集到了 URL，我们可以将这些 URL 发送到后端的一个新接口，让后端验证。
    // 但是为了不增加复杂度，我们可以利用现有的后端接口，将每个 URL 作为 query 参数（但 Serper 接口需要搜索词，不合适）。
    // 因此，我们只能在前端模拟检测（受跨域限制）。实际上，之前的库存检测是由后端在搜索时一并完成的，所以我们不能单独检测已收集的 URL。
    // 但是用户的需求是“对已收集的25个网址进行库存检测”，这些网址之前并没有经过后端验证（因为搜索过程中后端返回的 item 中已经包含了 status？实际上，在搜索过程中，后端返回的 data.results 已经包含了每个 URL 的 status（因为后端在返回前已经验证了）。
    // 仔细看代码：后端在返回结果时，已经对每个 URL 进行了验证（verifyPage），所以前端收到的 data.results 中的每个 item 都带有 status。
    // 因此，在搜索过程中，collectedResults 其实已经包含了 status（只要我们从 data.results 中保存下来）。我们之前并没有保存 status，只保存了 URL。现在可以改进：在收集阶段，不仅保存 URL，还保存对应的 status。
    // 这样，“检测”按钮实际上只是重新整理和显示结果，无需再次请求网络。
    // 因此，我们修改收集逻辑：在添加 newItems 时，同时保存每个 item 的 url 和 status（status 已经由后端提供）。检测按钮只需将已收集的结果重新分类并显示。
    // 这样完全满足需求，且无需额外网络请求。
    // 以下实现这一改进。
    // 我们会在 startSearch 中，将每次收到的 data.results 中的有效 item（去重后）保存到 collectedResults 数组（每个元素为 {url, status}）。
    // 检测按钮直接对这些结果进行分类显示。

    async function startSearch() {
        if (currentTask) {
            shouldStop = true;
            if (resumeResolver) resumeResolver();
            await currentTask;
        }
        shouldStop = false;
        isPaused = false;
        if (resumeResolver) resumeResolver = null;

        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) { showError('🐣 请先填写 Serper API 密钥～'); return; }
        const countries = getSelectedCountries();
        if (countries.length === 0) { showError('🌍 至少选择一个国家嗷'); return; }
        const keywords = buildKeywords();
        if (keywords.length === 0) { showError('🔍 请输入至少一个搜索关键词、SKU 或 UPC'); return; }
        const target = parseInt(document.getElementById('target').value) || 100;
        const proxyUrl = proxyUrlInput.value.trim();
        if (!proxyUrl) { showError('🖥️ 请填写后端代理地址'); return; }

        startBtn.disabled = true;
        pauseBtn.disabled = false;
        resumeBtn.disabled = true;
        detectBtn.disabled = true;   // 开始新搜索时禁用检测按钮
        saveUrlsBtn.disabled = true;
        errorDiv.style.display = 'none';
        resultArea.style.display = 'none';
        logArea.style.display = 'block';
        clearLog();
        addLog('✨ 开始寻宝之旅 ✨');

        let allResults = [];          // 存储 {url, status}
        let totalRequests = 0;
        let stopCollect = false;
        let totalUsdExcluded = 0;

        try {
            for (const country of countries) {
                if (stopCollect || shouldStop) break;
                for (const kw of keywords) {
                    if (stopCollect || shouldStop) break;
                    await waitIfPaused();
                    if (stopCollect || shouldStop) break;
                    addLog(`🔎 正在搜索 ${country} - “${kw}” ...`);
                    totalRequests++;
                    const response = await fetch(proxyUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: kw, country, apiKey })
                    });
                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`后端返回 ${response.status}: ${errText.slice(0, 100)}`);
                    }
                    const data = await response.json();
                    if (data.results && Array.isArray(data.results)) {
                        let filteredBlacklist = 0;
                        let usdThisBatch = 0;
                        const domainMap = new Map(); // key: domain, value: {url, status}
                        for (const item of data.results) {
                            if (isExcludedUrl(item.url)) {
                                filteredBlacklist++;
                                continue;
                            }
                            if (item.status === 'usd_excluded') {
                                usdThisBatch++;
                                totalUsdExcluded++;
                                continue;
                            }
                            try {
                                const host = new URL(item.url).hostname.replace(/^www\./, '');
                                if (!domainMap.has(host)) domainMap.set(host, { url: item.url, status: item.status });
                            } catch(e) {}
                        }
                        const newItems = Array.from(domainMap.values());
                        allResults.push(...newItems);
                        if (allResults.length > target) allResults = allResults.slice(0, target);
                        addLog(`📦 收到 ${data.results.length} 个原始结果，过滤黑名单 ${filteredBlacklist} 个，排除美元站 ${usdThisBatch} 个，剩余有效 ${newItems.length} 个独立域名，累计 ${allResults.length}/${target}`);
                        if (allResults.length >= target) {
                            addLog(`🎯 已达到目标数量 ${target}，停止搜索`);
                            stopCollect = true;
                            break;
                        }
                    } else {
                        addLog(`⚠️ 未获得有效结果`, true);
                    }
                    await new Promise(r => setTimeout(r, 200));
                }
            }
        } catch (err) {
            addLog(`❌ 错误: ${err.message}`, true);
            showError(`请求失败: ${err.message}`);
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            resumeBtn.disabled = true;
            detectBtn.disabled = true;
            saveUrlsBtn.disabled = true;
            currentTask = null;
            return;
        }

        if (shouldStop) {
            addLog("任务已停止", true);
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            resumeBtn.disabled = true;
            detectBtn.disabled = false;   // 停止后可以检测已收集的结果
            saveUrlsBtn.disabled = true;
            // 保存已收集的结果供检测按钮使用
            collectedResults = allResults;
            currentTask = null;
            return;
        }

        // 正常结束（达到目标或遍历完）
        addLog(`🏁 搜索结束，共收集 ${allResults.length} 个独立域名，开始整理结果`);
        addLog(`🔍 开始检测库存...`);

        // 直接显示结果
        displayResults(allResults, totalUsdExcluded);

        startBtn.disabled = false;
        pauseBtn.disabled = true;

        detectBtn.disabled = true;

    // 显示结果函数（供检测按钮和正常结束共用）
    function displayResults(results, totalUsdExcluded) {
        const buyable = results.filter(r => r.status === 'buyable').map(r => r.url);
        const soldOut = results.filter(r => r.status === 'sold_out').map(r => r.url);
        const unknown = results.filter(r => r.status === 'unknown').map(r => r.url);
        // usdExcluded 已经单独统计，不计入 results
        currentBuyableUrls = buyable;

        totalSpan.textContent = results.length;
        buyableSpan.textContent = buyable.length;
        soldOutSpan.textContent = soldOut.length;
        unknownSpan.textContent = unknown.length;
        usdSpan.textContent = totalUsdExcluded;

        buyableListDiv.innerHTML = '';
        if (buyable.length === 0) {
            buyableListDiv.innerHTML = '<div style="text-align:center; color:#bda48a; padding:2rem;">🍃 暂时没找到可购买的宝贝，试试更换关键词或国家～</div>';
            saveUrlsBtn.disabled = true;
        } else {
            buyable.forEach((url, idx) => {
                const div = document.createElement('div');
                div.className = 'url-item';
                const indexSpan = document.createElement('span');
                indexSpan.className = 'index';
                indexSpan.textContent = `${idx+1}.`;
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener';
                link.textContent = url;
                div.appendChild(indexSpan);
                div.appendChild(link);
                buyableListDiv.appendChild(div);
            });
            saveUrlsBtn.disabled = false;
        }

        addLog(`✅ 检测完成！可购买: ${buyable.length}，售罄: ${soldOut.length}，无法判断: ${unknown.length}，累计排除美元站: ${totalUsdExcluded}`);
        resultArea.style.display = 'block';
    }

        if (!collectedResults || collectedResults.length === 0) {

        }
        addLog(`🔍 开始检测已收集的 ${collectedResults.length} 个网址...`);
